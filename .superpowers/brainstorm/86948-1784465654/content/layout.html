<h2>整体页面布局方案</h2>
<p class="subtitle">请选择最符合你预期的主界面布局风格（简约易用）</p>

<div class="cards">

  <div class="card" data-choice="A" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:16px; background:#f8f8f8; border-radius:8px;">
      <div style="display:flex; gap:10px; height:180px;">
        <!-- Left panel: input -->
        <div style="flex:1; background:#fff; border-radius:6px; border:1.5px solid #e0e0e0; padding:10px; display:flex; flex-direction:column; gap:8px;">
          <div style="height:12px; background:#ff4757; border-radius:4px; width:60%;"></div>
          <div style="height:8px; background:#eee; border-radius:4px; width:90%;"></div>
          <div style="height:8px; background:#eee; border-radius:4px; width:75%;"></div>
          <div style="height:32px; background:#fff0f0; border-radius:4px; border:1px solid #ffcdd2; margin-top:4px;"></div>
          <div style="height:32px; background:#fff0f0; border-radius:4px; border:1px solid #ffcdd2;"></div>
          <div style="height:28px; background:#ff4757; border-radius:20px; margin-top:auto;"></div>
        </div>
        <!-- Right panel: output -->
        <div style="flex:1.2; display:flex; flex-direction:column; gap:8px;">
          <!-- Image preview -->
          <div style="flex:1.5; background:#fff; border-radius:6px; border:1.5px solid #e0e0e0; display:flex; align-items:center; justify-content:center;">
            <div style="width:60px; height:60px; background:linear-gradient(135deg,#ff4757,#ff6b81); border-radius:8px; opacity:0.6;"></div>
          </div>
          <!-- Title -->
          <div style="background:#fff; border-radius:6px; border:1.5px solid #e0e0e0; padding:8px;">
            <div style="height:8px; background:#eee; border-radius:4px; width:80%;"></div>
          </div>
          <!-- Body text -->
          <div style="flex:1; background:#fff; border-radius:6px; border:1.5px solid #e0e0e0; padding:8px;">
            <div style="height:7px; background:#eee; border-radius:4px; width:95%; margin-bottom:5px;"></div>
            <div style="height:7px; background:#eee; border-radius:4px; width:80%;"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A — 左右分栏</h3>
      <p>左侧配置输入区，右侧实时预览输出（图文、标题、正文）。桌面端体验最佳，信息密度高。</p>
    </div>
  </div>

  <div class="card" data-choice="B" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:16px; background:#f8f8f8; border-radius:8px;">
      <div style="height:180px; display:flex; flex-direction:column; gap:8px;">
        <!-- Top: input compact bar -->
        <div style="background:#fff; border-radius:6px; border:1.5px solid #e0e0e0; padding:8px 12px; display:flex; gap:10px; align-items:center;">
          <div style="height:10px; background:#ff4757; border-radius:4px; width:30%;"></div>
          <div style="height:10px; background:#eee; border-radius:4px; flex:1;"></div>
          <div style="height:24px; width:60px; background:#ff4757; border-radius:12px;"></div>
        </div>
        <!-- Bottom: 3 output blocks -->
        <div style="flex:1; display:flex; gap:8px;">
          <div style="flex:1.2; background:#fff; border-radius:6px; border:1.5px solid #e0e0e0; display:flex; align-items:center; justify-content:center;">
            <div style="width:50px; height:50px; background:linear-gradient(135deg,#ff4757,#ff6b81); border-radius:8px; opacity:0.6;"></div>
          </div>
          <div style="flex:1; display:flex; flex-direction:column; gap:6px; justify-content:center;">
            <div style="background:#fff; border-radius:6px; border:1.5px solid #e0e0e0; padding:8px;">
              <div style="height:7px; background:#eee; border-radius:4px; width:80%;"></div>
            </div>
            <div style="flex:1; background:#fff; border-radius:6px; border:1.5px solid #e0e0e0; padding:8px; min-height:50px;">
              <div style="height:7px; background:#eee; border-radius:4px; width:95%; margin-bottom:4px;"></div>
              <div style="height:7px; background:#eee; border-radius:4px; width:70%;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B — 顶部输入 + 下方结果</h3>
      <p>顶部精简输入栏，生成后下方展开图文/标题/正文三块结果。流程感强，适合步骤式操作。</p>
    </div>
  </div>

  <div class="card" data-choice="C" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:16px; background:#f8f8f8; border-radius:8px;">
      <div style="height:180px; display:flex; flex-direction:column; gap:8px; overflow:hidden;">
        <!-- Step indicator -->
        <div style="display:flex; gap:6px; align-items:center; padding:0 4px;">
          <div style="width:20px; height:20px; background:#ff4757; border-radius:50%; display:flex;align-items:center;justify-content:center;"></div>
          <div style="height:2px; flex:1; background:#ffcdd2;"></div>
          <div style="width:20px; height:20px; background:#eee; border-radius:50%;"></div>
          <div style="height:2px; flex:1; background:#eee;"></div>
          <div style="width:20px; height:20px; background:#eee; border-radius:50%;"></div>
        </div>
        <!-- Current step content -->
        <div style="flex:1; background:#fff; border-radius:6px; border:1.5px solid #e0e0e0; padding:12px; display:flex; flex-direction:column; gap:8px;">
          <div style="height:10px; background:#ff4757; border-radius:4px; width:40%;"></div>
          <div style="height:8px; background:#eee; border-radius:4px; width:90%;"></div>
          <div style="height:36px; background:#fff0f0; border-radius:4px; border:1px solid #ffcdd2;"></div>
          <div style="height:36px; background:#fff0f0; border-radius:4px; border:1px solid #ffcdd2;"></div>
        </div>
        <!-- Nav buttons -->
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <div style="height:24px; width:50px; background:#eee; border-radius:12px;"></div>
          <div style="height:24px; width:60px; background:#ff4757; border-radius:12px;"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C — 分步引导式</h3>
      <p>Step 1 配置模型 → Step 2 输入主题/选模板 → Step 3 查看生成结果并编辑。流程清晰，新手友好，但步骤感略重。</p>
    </div>
  </div>

</div>
